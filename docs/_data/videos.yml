      id: "MTE2cWotMKg"
      title: "QUBO++ 入門（Python）"
      text: "QUBO++ とは何かから、変数と式、ソルバー、配列、制約、整数変数、非線形関数までを、1 本でひととおり紹介します。"
      duration: "45:39"
    en:
      id: "x8JLd4WdPjo"
      title: "QUBO++ Tutorial (Python)"
      text: "All the basics in one video: what QUBO++ is, variables and expressions, solvers, arrays, constraints, integer variables and nonlinear functions."
      duration: "38:17"
  - slug: varexpr
