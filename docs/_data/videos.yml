    en:
      id: "GZak2Yk6I8c"
      title: "QUBO++ Slicing and einsum (Python)"
      text: "Building expressions from arrays fast with slicing, concat and einsum instead of Python for loops: the traveling salesman tour length in one einsum line, and a magic square with every constraint written by einsum."
