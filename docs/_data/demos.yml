# Browser demos shown on full-window pages (layout "demo").
#   api            Lambda Function URL the page calls for solving (the page itself
#                  is served from this site; the Lambda serves only the API).
#   layout         board (default): square board, fitted to the window height
#                  column: the app's own width (760px), for tables and many controls
#                  wide: the app sets its own width (up to 1400px)
#                  fill: the app fills the window below the heading (Playgrounds)
#   width          optional width of the heading and the app (layout wide; default 1400px)
#   theme_key      localStorage key the demo's app.js uses for its light/dark theme
#   theme_default  the app's theme when nothing is stored (default light)
# The front end is copied from demos/<id>/ by demos/sync_docs_demos.py.
nqueen:
  api: "https://lsuxxbj2xmy5nrdnw7i53hxtiu0hazyg.lambda-url.ap-northeast-1.on.aws"
  theme_key: "nqueen-theme"
